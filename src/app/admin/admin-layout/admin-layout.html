<div class="admin-layout">
  <aside class="admin-sidebar" [class.menu-open]="menuOpen()">
    <div class="admin-brand">
      <h2>Orderit</h2>
      <span>{{ isAdmin() ? 'Admin' : 'Waiter' }}</span>
    </div>

    <button class="staff-menu-toggle" (click)="menuOpen.set(!menuOpen())" [attr.aria-expanded]="menuOpen()" aria-controls="staff-navigation">{{ menuOpen() ? 'Close navigation ×' : 'Navigate ☰' }}</button>
    <nav id="staff-navigation" class="admin-navigation" aria-label="Staff navigation" (click)="menuOpen.set(false)">
      @if (isAdmin()) {
      <a
        routerLink="/admin"
        routerLinkActive="active" ariaCurrentWhenActive="page"
        [routerLinkActiveOptions]="{ exact: true }"
        class="nav-item"
      >
        Dashboard
      </a>
      }

      @if (isAdmin()) {
      <a
        routerLink="/admin/menu"
        routerLinkActive="active" ariaCurrentWhenActive="page"
        class="nav-item"
      >
        Menu
      </a>
      }

      <a
        routerLink="/admin/tables"
        routerLinkActive="active" ariaCurrentWhenActive="page"
        class="nav-item"
      >
        Tables
      </a>

      <a
        routerLink="/admin/orders"
        routerLinkActive="active" ariaCurrentWhenActive="page"
        class="nav-item"
      >
        Orders
      </a>

      @if (isAdmin()) {
      <a
        routerLink="/admin/waiters"
        routerLinkActive="active" ariaCurrentWhenActive="page"
        class="nav-item"
      >
        Waiters
      </a>
      }
    </nav>

    <button
      class="logout-button"
      type="button"
      [disabled]="isLoggingOut()"
      (click)="logout()"
    >
      {{ isLoggingOut() ? 'Logging out...' : 'Logout' }}
    </button>
  </aside>

  <section class="admin-content">
    <div class="admin-topbar">
      <a
        routerLink="/"
        target="_blank"
        class="view-site-button"
      >
        View Customer Site ↗
      </a>
    </div>

    <main class="admin-page">
      <router-outlet></router-outlet>
    </main>
  </section>
</div>
