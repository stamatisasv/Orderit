<nav aria-label="Main navigation">
  <a class="wordmark" routerLink="/" aria-label="Orderit home"
    >Orderit<span aria-hidden="true">✳</span><small>GOOD COMPANY</small></a
  >
  @if (guest.state(); as table) {
    <a
      class="current-table"
      routerLink="/order"
      [queryParams]="{ table: guest.token(), view: 'menu' }"
      ><span aria-hidden="true">●</span>{{ table.name }}</a
    >
  }
  <div class="nav-links">
    <a
      routerLink="/"
      routerLinkActive="active"
      [routerLinkActiveOptions]="{ exact: true }"
      ariaCurrentWhenActive="page"
      ><svg
        viewBox="0 0 24 24"
        fill="none"
        stroke="currentColor"
        stroke-width="1.6"
        aria-hidden="true"
      >
        <path d="m3 10 9-7 9 7v10H3Z" />
        <path d="M9 20v-7h6v7" /></svg
      ><span>Home</span></a
    >
    <a
      routerLink="/order"
      [queryParams]="{ table: guest.token(), view: 'menu' }"
      [class.active]="isMenu()"
      [attr.aria-current]="isMenu() ? 'page' : null"
      ><svg
        viewBox="0 0 24 24"
        fill="none"
        stroke="currentColor"
        stroke-width="1.6"
        aria-hidden="true"
      >
        <path d="M4 3v6m3-6v6m3-6v6M4 7h6M7 9v12M18 3v18m0-18c-4 2-4 9 0 9" /></svg
      ><span>Menu</span></a
    >
    <a
      class="basket-link"
      routerLink="/basket"
      [queryParams]="{ table: guest.token() }"
      routerLinkActive="active"
      ariaCurrentWhenActive="page"
      ><svg
        viewBox="0 0 24 24"
        fill="none"
        stroke="currentColor"
        stroke-width="1.6"
        aria-hidden="true"
      >
        <path d="M3 8h18l-2 12H5Z" />
        <path d="m8 8 4-5 4 5M9 12v4m6-4v4" /></svg
      ><span>Basket</span>
      @if (guest.count()) {
        <span class="basket-count">{{ guest.count() }}</span>
      }
    </a>
  </div>
</nav>
